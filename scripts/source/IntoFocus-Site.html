  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

80px);margin:0 auto;padding:96px 0 40px;\">\n          <div style=\"position:relative;border-radius:34px;background:rgba(8,22,40,.96);border:1px solid rgba(46,183,255,.34);box-shadow:0 0 0 1px rgba(56,189,248,.14),0 36px 110px rgba(0,0,0,.5);overflow:hidden;\">\n            <div style=\"height:6px;background:linear-gradient(90deg,#38bdf8,#4f46e5);\"><\u002Fdiv>\n            <div style=\"height:2px;margin-top:-2px;background:rgba(0,240,255,.2);\"><div style=\"height:100%;width:{{ deskProgress }};background:#00f0ff;box-shadow:0 0 12px #00f0ff;transition:width .6s cubic-bezier(.22,.9,.24,1);\"><\u002Fdiv><\u002Fdiv>\n            <div style=\"padding:clamp(24px,4vw,40px);\">\n              <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;\">\n                <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:#8fa8c2;\">Project brief · About 3 minutes<\u002Fspan>\n                <span style=\"font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#7dd3fc;\">{{ deskCounter }}<\u002Fspan>\n              <\u002Fdiv>\n              <div role=\"tablist\" style=\"margin-top:20px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid rgba(100,160,207,.2);\">\n                <sc-for list=\"{{ deskTabs }}\" as=\"t\" hint-placeholder-count=\"4\">\n                  <button role=\"tab\" sc-camel-on-click=\"{{ t.select }}\" disabled=\"{{ t.locked }}\" style=\"display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 8px;margin-bottom:-1px;border:0;border-bottom:2px solid {{ t.line }};background:transparent;font:650 14px Inter,sans-serif;color:{{ t.color }};transition:color .2s ease,border-color .2s ease;\"><span style=\"font-family:ui-monospace,Menlo,monospace;font-size:11px;color:{{ t.numColor }};\">{{ t.mark }}<\u002Fspan>{{ t.name }}<\u002Fbutton>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <sc-if value=\"{{ deskSent }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"padding:56px 0 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;animation:iomEnter .6s cubic-bezier(.22,.9,.24,1) both;\">\n                  <span style=\"width:64px;height:64px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(52,211,153,.14);border:1.5px solid #34d399;color:#34d399;font-size:26px;animation:pingCyan 2s ease-out infinite;\">✓<\u002Fspan>\n                  <h3 style=\"margin:0;font-size:28px;font-weight:800;letter-spacing:-.03em;color:#fff;\">Brief received.<\u002Fh3>\n                  <p style=\"margin:0;max-width:440px;font-size:16px;color:#b8c7d9;\">We read the brief first. If it is a fit, we come back with a match. If it is not, you hear that fast.<\u002Fp>\n                  <button sc-camel-on-click=\"{{ deskReset }}\" style=\"margin-top:8px;padding:10px 18px;border-radius:999px;border:1px solid rgba(46,183,255,.28);background:rgba(6,16,30,.78);color:#f5f9ff;font:650 14px Inter,sans-serif;\" style-hover=\"border-color:rgba(46,183,255,.6);\">Send another brief<\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ deskOpen }}\" hint-placeholder-val=\"{{ true }}\">\n                <form sc-camel-on-submit=\"{{ deskNext }}\" style=\"display:flex;flex-direction:column;gap:18px;padding-top:28px;\">\n                  <sc-if value=\"{{ stepIs0 }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"display:flex;flex-direction:column;gap:18px;animation:iomEnter .48s cubic-bezier(.22,.9,.24,1) both;\">\n                      <div><h3 style=\"margin:0;font-size:26px;font-weight:800;letter-spacing:-.03em;color:#fff;\">Who should we talk to?<\u002Fh3><p style=\"margin:6px 0 0;font-size:15px;color:#8fa8c2;\">So we know who to reply to.<\u002Fp><\u002Fdiv>\n                      <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;\">\n                        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:#dcebfa;\">Name<input required=\"true\" autocomplete=\"name\" style=\"padding:13px 16px;border-radius:14px;background:#1a2942;border:1px solid rgba(255,255,255,.18);color:#fff;font:400 15px Inter,sans-serif;outline:none;transition:border-color .2s ease,box-shadow .2s ease;\" style-focus=\"border-color:#2eb7ff;box-shadow:0 0 0 3px rgba(46,183,255,.22);\"><\u002Flabel>\n                        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:#dcebfa;\">Work email<input type=\"email\" required=\"true\" autocomplete=\"email\" style=\"padding:13px 16px;border-radius:14px;background:#1a2942;border:1px solid rgba(255,255,255,.18);color:#fff;font:400 15px Inter,sans-serif;outline:none;transition:border-color .2s ease,box-shadow .2s ease;\" style-focus=\"border-color:#2eb7ff;box-shadow:0 0 0 3px rgba(46,183,255,.22);\"><\u002Flabel>\n                        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:#dcebfa;\">Company name<input required=\"true\" autocomplete=\"organization\" style=\"padding:13px 16px;border-radius:14px;background:#1a2942;border:1px solid rgba(255,255,255,.18);color:#fff;font:400 15px Inter,sans-serif;outline:none;transition:border-color .2s ease,box-shadow .2s ease;\" style-focus=\"border-color:#2eb7ff;box-shadow:0 0 0 3px rgba(46,183,255,.22);\"><\u002Flabel>\n                        <label style=\"display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:#dcebfa;\"><span>Company website <span style=\"font-weight:500;color:#8fa8c2;\">optional<\u002Fspan><\u002Fspan><input type=\"url\" placeholder=\"https://\" style=\"padding:13px 16px;border-radius:14px;background:#1a2942;border:1px solid rgba(255,255,255,.18);color:#fff;font:400 15px Inter,sans-serif;outline:none;transition:border-color .2s ease,box-shadow .2s ease;\" style-focus=\"border-color:#2eb7ff;box-shadow:0 0 0 3px rgba(46,183,255,.22);\"><\u002Flabel>\n                      <\u002Fdiv>\n                      <fieldset style=\"margin:0;padding:0;border:0;display:flex;flex-direction:column;gap:10px;\"><legend style=\"padding:0;margin-bottom:10px;font-size:14px;font-weight:700;color:#dcebfa;\">Are you the decision-maker for this project?<\u002Flegend><div style=\"display:flex;flex-wrap:wrap;gap:8px;\"><sc-for list=\"{{ chips.decision }}\" as=\"c\" hint-placeholder-count=\"3\"><button type=\"button\" sc-camel-on-click=\"{{ c.pick }}\" style=\"padding:10px 18px;border-radius:999px;font:650 14px Inter,sans-serif;color:{{ c.fg }};background:{{ c.bg }};border:1px solid {{ c.bd }};box-shadow:{{ c.glow }};transition:all .2s ease;\" style-hover=\"border-color:rgba(46,183,255,.6);\">{{ c.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Ffieldset>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ stepIs1 }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;flex-direction:column;gap:18px;animation:iomEnter .48s cubic-bezier(.22,.9,.24,1) both;\">\n                      <div><h3 style=\"margin:0;font-size:26px;font-weight:800;letter-spacing:-.03em;color:#fff;\">What should the build do?<\u002Fh3><p style=\"margin:6px 0 0;font-size:15px;color:#8fa8c2;\">Plain language is fine. One problem, described well, is enough.<\u002Fp><\u002Fdiv>\n                      <label style=\"display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:#dcebfa;\">The problem today<textarea required=\"true\" rows=\"4\" style=\"min-height:118px;padding:13px 16px;border-radius:14px;background:#1a2942;border:1px solid rgba(255,255,255,.18);color:#fff;font:400 15px/1.55 Inter,sans-serif;outline:none;resize:vertical;\" style-focus=\"border-color:#2eb7ff;box-shadow:0 0 0 3px rgba(46,183,255,.22);\"><\u002Ftextarea><\u002Flabel>\n                      <label style=\"display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:#dcebfa;\">What good looks like<textarea rows=\"3\" style=\"min-height:96px;padding:13px 16px;border-radius:14px;background:#1a2942;border:1px solid rgba(255,255,255,.18);color:#fff;font:400 15px/1.55 Inter,sans-serif;outline:none;resize:vertical;\" style-focus=\"border-color:#2eb7ff;box-shadow:0 0 0 3px rgba(46,183,255,.22);\"><\u002Ftextarea><\u002Flabel>\n                      <fieldset style=\"margin:0;padding:0;border:0;\"><legend style=\"padding:0;margin-bottom:10px;font-size:14px;font-weight:700;color:#dcebfa;\">Closest fit<\u002Flegend><div style=\"display:flex;flex-wrap:wrap;gap:8px;\"><sc-for list=\"{{ chips.kind }}\" as=\"c\" hint-placeholder-count=\"5\"><button type=\"button\" sc-camel-on-click=\"{{ c.pick }}\" style=\"padding:10px 18px;border-radius:999px;font:650 14px Inter,sans-serif;color:{{ c.fg }};background:{{ c.bg }};border:1px solid {{ c.bd }};box-shadow:{{ c.glow }};transition:all .2s ease;\" style-hover=\"border-color:rgba(46,183,255,.6);\">{{ c.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Ffieldset>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ stepIs2 }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;flex-direction:column;gap:18px;animation:iomEnter .48s cubic-bezier(.22,.9,.24,1) both;\">\n                      <div><h3 style=\"margin:0;font-size:26px;font-weight:800;letter-spacing:-.03em;color:#fff;\">What is at stake?<\u002Fh3><p style=\"margin:6px 0 0;font-size:15px;color:#8fa8c2;\">Helps us match a team that can carry the risk.<\u002Fp><\u002Fdiv>\n                      <fieldset style=\"margin:0;padding:0;border:0;\"><legend style=\"padding:0;margin-bottom:10px;font-size:14px;font-weight:700;color:#dcebfa;\">What would it touch?<\u002Flegend><div style=\"display:flex;flex-wrap:wrap;gap:8px;\"><sc-for list=\"{{ chips.data }}\" as=\"c\" hint-placeholder-count=\"4\"><button type=\"button\" sc-camel-on-click=\"{{ c.pick }}\" style=\"padding:10px 18px;border-radius:999px;font:650 14px Inter,sans-serif;color:{{ c.fg }};background:{{ c.bg }};border:1px solid {{ c.bd }};box-shadow:{{ c.glow }};transition:all .2s ease;\" style-hover=\"border-color:rgba(46,183,255,.6);\">{{ c.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Ffieldset>\n                      <label style=\"display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:#dcebfa;\">Who approves before anything goes live?<input style=\"padding:13px 16px;border-radius:14px;background:#1a2942;border:1px solid rgba(255,255,255,.18);color:#fff;font:400 15px Inter,sans-serif;outline:none;\" style-focus=\"border-color:#2eb7ff;box-shadow:0 0 0 3px rgba(46,183,255,.22);\"><\u002Flabel>\n                      <div style=\"display:flex;gap:12px;padding:16px 18px;border-radius:16px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.38);font-size:14px;line-height:1.55;color:#fde68a;\"><span style=\"font-family:ui-monospace,Menlo,monospace;font-weight:800;\">!<\u002Fspan><span>Please do not submit confidential, sensitive, regulated, financial, health, legal, HR, account-access, or highly sensitive business information through this form.<\u002Fspan><\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ stepIs3 }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;flex-direction:column;gap:18px;animation:iomEnter .48s cubic-bezier(.22,.9,.24,1) both;\">\n                      <div><h3 style=\"margin:0;font-size:26px;font-weight:800;letter-spacing:-.03em;color:#fff;\">When does it need to land?<\u002Fh3><p style=\"margin:6px 0 0;font-size:15px;color:#8fa8c2;\">Last step.<\u002Fp><\u002Fdiv>\n                      <fieldset style=\"margin:0;padding:0;border:0;\"><legend style=\"padding:0;margin-bottom:10px;font-size:14px;font-weight:700;color:#dcebfa;\">Timeline<\u002Flegend><div style=\"display:flex;flex-wrap:wrap;gap:8px;\"><sc-for list=\"{{ chips.timing }}\" as=\"c\" hint-placeholder-count=\"4\"><button type=\"button\" sc-camel-on-click=\"{{ c.pick }}\" style=\"padding:10px 18px;border-radius:999px;font:650 14px Inter,sans-serif;color:{{ c.fg }};background:{{ c.bg }};border:1px solid {{ c.bd }};box-shadow:{{ c.glow }};transition:all .2s ease;\" style-hover=\"border-color:rgba(46,183,255,.6);\">{{ c.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Ffieldset>\n                      <fieldset style=\"margin:0;padding:0;border:0;\"><legend style=\"padding:0;margin-bottom:10px;font-size:14px;font-weight:700;color:#dcebfa;\">Preferred follow-up<\u002Flegend><div style=\"display:flex;flex-wrap:wrap;gap:8px;\"><sc-for list=\"{{ chips.follow }}\" as=\"c\" hint-placeholder-count=\"2\"><button type=\"button\" sc-camel-on-click=\"{{ c.pick }}\" style=\"padding:10px 18px;border-radius:999px;font:650 14px Inter,sans-serif;color:{{ c.fg }};background:{{ c.bg }};border:1px solid {{ c.bd }};box-shadow:{{ c.glow }};transition:all .2s ease;\" style-hover=\"border-color:rgba(46,183,255,.6);\">{{ c.label }}<\u002Fbutton><\u002Fsc-for><\u002Fdiv><\u002Ffieldset>\n                      <label style=\"display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border-radius:16px;background:rgba(6,16,30,.78);border:1px solid rgba(255,255,255,.14);font-size:14px;font-weight:500;line-height:1.55;color:#dcebfa;\"><input type=\"checkbox\" required=\"true\" style=\"margin-top:3px;accent-color:#2eb7ff;width:16px;height:16px;\">I understand submitting a project doesn't guarantee a match or a quote.<\u002Flabel>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:8px;\">\n                    <sc-if value=\"{{ canBa desk: {} };\n  componentDidMount() {\n    const h = (location.hash || '').replace('#', '');\n    if (this.PAGES.includes(h)) this.setState({ page: h });\n    this.applyProps();\n    this.onMove = (e) => {\n      const s = document.documentElement.style;\n      s.setProperty('--cx', e.clientX + 'px');\n      s.setProperty('--cy', e.clientY + 'px');\n    };\n    window.addEventListener('pointermove', this.onMove);\n    this.onDocClick = (e) => { if (this.state.menu && !e.target.closest('nav')) this.setState({ menu: false }); };\n    document.addEventListener('click', this.onDocClick);\n    this.mountCursor();\n  }\n  componentDidUpdate() { this.applyProps(); }\n  componentWillUnmount() {\n    window.removeEventListener('pointermove', this.onMove);\n    document.removeEventListener('click', this.onDocClick);\n    this.unmountCursor();\n  }\n  PAGES = ['home', 'modules', 'ai-search-product-sellers', 'ai-project-desk', 'faq', 'contact', 'privacy'];\n  go(page) {\n    return (e) => {\n      if (e && e.preventDefault) e.preventDefault();\n      try { history.replaceState(null, '', '#' + page); } catch (_) {}\n      this.setState({ page, menu: false });\n      window.scrollTo({ top: 0, behavior: 'smooth' });\n    };\n  }\n  applyProps() {\n    const s = document.documentElement.style;\n    s.setProperty('--ms', String(this.props.motionScale ?? 1));\n    s.setProperty('--stars', (this.props.starfield ?? true) ? '1' : '0');\n    s.setProperty('--wash', (this.props.pointerWash ?? true) ? '1' : '0');\n    const want = this.props.reticleCursor ?? true;\n    if (want && !this.cursor) this.mountCursor();\n    if (!want && this.cursor) this.unmountCursor();\n  }\n  mountCursor() {\n    if (this.cursor || !(this.props.reticleCursor ?? true)) return;\n    if (!window.matchMedia('(pointer: fine)').matches) return;\n    document.documentElement.classList.add('iom-cursor');\n    const c = document.createElement('div');\n    c.setAttribute('aria-hidden', 'true');\n    c.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;z-index:100000;pointer-events:none;will-change:transform;opacity:0;transition:opacity .2s;';\n    const tick = 'position:absolute;background:rgba(46,183,255,.85);box-shadow:0 0 6px rgba(46,183,255,.5);transition:transform .18s ease;';\n    c.innerHTML =\n      '<span data-r style=\"position:absolute;top:-11px;left:-11px;width:22px;height:22px;border:1px solid rgba(46,183,255,.72);border-radius:50%;box-shadow:0 0 12px rgba(46,183,255,.35),inset 0 0 8px rgba(46,183,255,.12);transition:transform .18s ease,border-color .18s ease,box-shadow .18s ease;\"><\u002Fspan>' +\n      '<span data-c style=\"position:absolute;top:-2px;left:-2px;width:4px;height:4px;border-radius:50%;background:#2eb7ff;box-shadow:0 0 10px rgba(46,183,255,.95);transition:transform .12s ease,box-shadow .12s ease;\"><\u002Fspan>' +\n      '<span data-t=\"n\" style=\"' + tick + 'left:-.5px;top:-18px;width:1px;height:5px;\"><\u002Fspan>' +\n      '<span data-t=\"s\" style=\"' + tick + 'left:-.5px;top:13px;width:1px;height:5px;\"><\u002Fspan>' +\n      '<span data-t=\"e\" style=\"' + tick + 'top:-.5px;left:13px;width:5px;height:1px;\"><\u002Fspan>' +\n      '<span data-t=\"w\" style=\"' + tick + 'top:-.5px;left:-18px;width:5px;height:1px;\"><\u002Fspan>';\n    document.body.appendChild(c);\n    this.cursor = c;\n    const ring = c.querySelector('[data-r]'), core = c.querySelector('[data-c]');\n    const ticks = {};\n    c.querySelectorAll('[data-t]').forEach((t) => (ticks[t.dataset.t] = t));\n    const SEL = 'a[href],button:not(:disabled),input,select,textarea,label,summary,[role=\"button\"],[role=\"tab\"]';\n    let hover = false;\n    const paint = (h) => {\n      ring.style.transform = h ? 'scale(1.45)' : '';\n      ring.style.borderColor = h ? 'rgba(0,240,255,.95)' : 'rgba(46,183,255,.72)';\n      ring.style.boxShadow = h ? '0 0 18px rgba(0,240,255,.55),inset 0 0 10px rgba(0,240,255,.18)' : '0 0 12px rgba(46,183,255,.35),inset 0 0 8px rgba(46,183,255,.12)'; nsparent',\n        };\n      }),\n      deskNext: (e) => {\n        e.preventDefault();\n        if (step < 3) this.setState({ step: step + 1 });\n        else this.setState({ deskSent: true });\n      },\n      deskBack: () => this.setState({ step: Math.max(0, step - 1) }),\n      deskReset: () => this.setState({ deskSent: false, step: 0, desk: {} }),\n      jumpToBrief: (e) => {\n        e.preventDefault();\n        const el = document.getElementById('brief');\n        if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 80, behavior: 'smooth' });\n      },\n      whySubmit: ['One brief instead of hunting vendors', 'We vet the team', 'A scope and quote, or a clear no'].map((t, i) => ({ t, delay: 'calc(' + (520 + i * 110) + 'ms*var(--ms,1))' })),\n      deskSteps: [\n        { n: '01', t: 'Review', d: 'We read the brief first.' },\n        { n: '02', t: 'Match', d: 'We match qualifying work to a team we vet.' },\n        { n: '03', t: 'Scope + quote', d: 'If it is a fit, we introduce you and help coordinate billing.' },\n      ],\n    };\n  }\n  FAQ = [\n    ['What does IntoFocus do?', 'We implement org-ready agentic teams for one defined problem, put them in your business, and keep them current as the work changes.'],\n    ['What is a Module?', 'Software for one problem. Your team runs it. You decide what goes public.'],\n    ['What is AEO Consensus Control?', 'The first Module. It helps you become the answer when someone asks AI what to buy — on the open web and on Amazon. It is in early access.'],\n    ['Do I have to let AI publish for me?', 'No. You can do the work, have us show you, or have us do it. Anything the market will see still needs your OK.'],\n    ['Can you build a custom project?', 'Yes, if it is a fit. Send a brief to the AI Project Desk. We review it, match qualifying work to a team we vet, and get you a scope and quote.'],\n    ['Is this only for one industry?', 'No. Fit is the problem. The first Module is built for brands and product sellers.'],\n    ['Why only one Module right now?', 'Because one result done well beats a pile of unfinished tools. The next Module ships when it is real.'],\n  ];\n  faqVals() {\n    const o = this.state.faq;\n    return {\n      faqs: this.FAQ.map(([q, a], i) => {\n        const open = o === i;\n        return {\n          q, a, open, n: '0' + (i + 1),\n          toggle: () => this.setState({ faq: open ? -1 : i }),\n          rot: open ? 'rotate(45deg)' : 'none',\n          border: open ? 'rgba(0,240,255,.55)' : 'rgba(100,160,207,.24)',\n          glow: open ? '0 0 0 1px rgba(56,189,248,.18),0 18px 48px rgba(56,189,248,.14)' : 'none',\n          delay: 'calc(' + (150 + i * 70) + 'ms*var(--ms,1))',\n        };\n      }),\n    };\n  }\n  PRIVACY = [\n    { t: 'Information We Collect', p: ['We may collect information you voluntarily provide through our website contact, AI Project Desk, or discovery forms, including name, company name, email address, website, company size, information about business processes or operational challenges, project details, and preferred follow-up method.', 'We and our service providers may also automatically process limited technical information, such as IP address, browser and device information, request metadata, security signals, and website performance information, to operate, secure, and improve the website.'] },\n    { t: 'How We Use Information', p: ['We use information to respond to inquiries, evaluate fit, prepare for discovery conversations or project matching, improve our website and services, protect against spam or abuse, and maintain reasonable business records. We do not sell your personal information.'] },\n    { t: 'Contact and Project Desk Form Submissions', p: ['When you submit a contact or AI Project Desk form, the information you provide is sent to IntoFocus AI at info@intofocus.ai and may pass through service providers used for hosting, form processing, spam prevention, email delivery, and website security. AI Project Desk submissions may also be shared with an approved development partner as described on that page, solely to prepare a project quote.', 'Please do not submit confidential, sensitive, regulated, financial, health, legal, HR, account-access, or highly sensitive business information through the public website forms.'] },\n    { t: 'Website Hosting, Security, and Spam Prevention', p: ['Our website is hosted using Cloudflare Pages. We may use Cloudflare Pages Functions to process website form submissions and Cloudflare Turnstile to help protect the form from spam, bots, and abuse.', 'These tools may process limited technical information such as IP address, browser/device information, request metadata, and interaction signals needed to provide, secure, and protect the website.'] },\n    { t: 'Cookies and Analytics', p: ['Our website may use cookies or similar technologies only where needed for website functionality, security, spam prevention, or performance.', 'At launch, we do not intend to use advertising cookies, behavioral advertising tools, or cross-site tracking pixels. If we add analytics tools, such as Cloudflare Web Analytics, we will update this Privacy Policy as needed before or when those tools are enabled.'] },\n    { t: 'Service Providers', p: ['We may use trusted service providers to operate the website and process form submissions. These may include website hosting providers, email providers, spam-prevention tools, form-processing tools, analytics tools, or security tools.', 'These providers may process information as needed to provide their services to us and according to their own applicable terms and privacy commitments.'] },\n    { t: 'AI-Related Information', p: ['IntoFocus AI builds and licenses governed AI Modules, and separately reviews custom AI project submissions through the AI Project Desk. Information you submit through the website may be reviewed by our team to understand your business needs and respond to your inquiry, or to prepare a project brief for an approved development partner.', 'We do not ask you to submit confidential, sensitive, or regulated information through the website forms. If a future client engagement requires handling sensitive or regulated data, separate agreements, safeguards, and review processes may apply.'] },\n    { t: 'Data Retention', p: ['We keep inquiry information for as long as reasonably necessary to respond to your request, manage prospective client communications, maintain business records, improve our services, resolve disputes, and meet legal or operational obligations.'] },\n    { t: 'Data Security', p: ['We use reasonable administrative, technical, and organizational measures to protect information submitted through the website. No website or internet transmission is completely secure, so we cannot guarantee absolute security.'] },\n    { t: 'Your Choices and Privacy Requests', p: ['Depending on where you live, you may have privacy rights under applicable law. You may contact us at info@intofocus.ai to request access, correction, or deletion of information you submitted, subject to legal, security, business, and recordkeeping limits.'] },\n    { t: 'Children’s Privacy', p: ['Our website and services are intended for businesses and are not directed to children. We do not knowingly collect personal information from children.'] },\n    { t: 'Links to Other Websites', p: ['Our website may link to third-party websites or services. We are not responsible for the privacy practices, content, or security of those third-party sites.'] },\n    { t: 'Changes to This Policy', p: ['We may update this Privacy Policy from time to time. The updated version will be posted on this page with a revised effective date.'] },\n    { t: 'Contact Us', p: ['If you have questions about this Privacy Policy, contact us at info@intofocus.ai.'] },\n  ];\n  tierVals() {\n    const YOU = { fg: '#bae6fd', bg: 'rgba(56,189,248,.14)', bd: 'rgba(56,189,248,.45)' };\n    const IF = { fg: '#e0e7ff', bg: 'rgba(99,102,241,.22)', bd: 'rgba(129,140,248,.6)' };\n    const role = (k, who) => ({ k, v: who === 'you' ? 'You' : 'IntoFocus', ...(who === 'you' ? YOU : IF) });\n    const T = [\n      { name: 'Lookout', tag: 'We show you, You do it.', d: 'We hand you the finding and the next move. Your team runs it.',\n        roles: [role('Find the gap and the next move', 'if'), role('Run the move', 'you'), role('OK anything public', 'you')] },\n      { name: 'Co-Pilot', tag: 'We do it with you.', d: 'You execute. We direct and review beside you.',\n        roles: [role('Direct and review', 'if'), role('Execute', 'you'), role('OK anything public', 'you')] },\n      { name: 'Autopilot', tag: 'We do it.', d: 'We run approved plays. You still green-light anything public.',\n        roles: [role('Run approved plays', 'if'), role('Green-light anything public', 'you')] },\n    ];\n    const i = this.state.tier;\n    return {\n      tiers: T.map((t, j) => ({\n        name: t.name,\n        select: () => this.setState({ tier: j }),\n        color: j === i ? '#fff' : '#b8c7d9',\n        bg: j === i ? '#0284c7' : 'transparent',\n        shadow: j === i ? '0 0 18px rgba(46,183,255,.35)' : 'none',\n      })),\n      tier: { ...T[i], idx: 'Mode 0' + (i + 1) + ' / 03' },\n    };\n  }\n  navItem(active) {\n    return active\n      ? { color: '#f0f9ff', bg: 'rgba(14,116,144,.35)', ring: 'inset 0 0 0 1px rgba(125,211,252,.55)' }\n      : { color: '#c9d8ea', bg: 'transparent', ring: 'none' };\n  }\n  renderVals() {\n    const p = this.state.page;\n    const ms = (n) => 'calc(' + n + 'ms*var(--ms,1))';\n    return {\n      isHome: p === 'home', isModules: p === 'modules', isAeo: p === 'ai-search-product-sellers',\n      isDesk: p === 'ai-project-desk', isFaq: p === 'faq', isContact: p === 'contact', isPrivacy: p === 'privacy',\n      goHome: this.go('home'), goModules: this.go('modules'), goAeo: this.go('ai-search-product-sellers'),\n      goDesk: this.go('ai-project-desk'), goFaq: this.go('faq'), goContact: this.go('contact'), goPrivacy: this.go('privacy'),\n      nav: {\n        home: this.navItem(p === 'home'),\n        modules: this.navItem(p === 'modules' || p === 'ai-search-product-sellers'),\n        desk: this.navItem(p === 'ai-project-desk'),\n        faq: this.navItem(p === 'faq'),\n        contact: this.navItem(p === 'contact'),\n      },\n      menuOpen: this.state.menu,\n      menuChevron: this.state.menu ? 'rotate(180deg)' : 'none',\n      toggleMenu: (e) => { e.stopPropagation(); this.setState((s) => ({ menu: !s.menu })); },\n      subscribed: this.state.subscribed, notSubscribed: !this.state.subscribed,\n      subscribe: (e) => { e.preventDefault(); this.setState({ subscribed: true }); },\n      homeSteps: [\n        { n: '01', t: \"You get the expert. You don't have to hire them.\", d: 'The judgment already exists. We put it in a Module your team can run.' },\n        { n: '02', t: 'You choose how the work gets done.', d: 'Do the recommendation, have us show you, or have us do it. Anything the market will see still needs your OK.' },\n        { n: '03', t: 'Stay ahead as it changes', d: 'AI will not pause after install. A one-time project is stale in weeks. We keep the Module current so you stay on the new curve, not the last one.' },\n      ],\n      ppp: [\n        { n: '01', t: 'Presence', v: 'found', w: '100%', delay: ms(300) },\n        { n: '02', t: 'Portrayal', v: 'described', w: '72%', delay: ms(450) },\n        { n: '03', t: 'Proof', v: 'trusted', w: '48%', delay: ms(600) },\n      ],\n      govSteps: [\n        { n: '01', t: 'Draft', d: 'Evidence attached', delay: ms(0) },\n        { n: '02', t: 'Staged', d: 'Exact version locked', delay: ms(1000) },\n        { n: '03', t: 'Approved', d: 'Named human gate', delay: ms(2000) },\n        { n: '04', t: 'Executed', d: 'Bounded external write', delay: ms(3000) },\n        { n: '05', t: 'Validated', d: 'Evidence recorded', delay: ms(4000) },\n      ],\n      growBars: [18, 26, 34, 48, 66, 100].map((h, i) => ({ h: h + '%', delay: ms(i * 90) })),\n      pppCards: [\n        { n: '01', t: 'Presence', v: 'found', d: 'You are either in the answer or you are invisible. There is no page two.' },\n        { n: '02', t: 'Portrayal', v: 'described', d: 'Getting named is worthless if it describes the wrong product.' },\n        { n: '03', t: 'Proof', v: 'trusted', d: 'The model trusts the person who bought it, not the studio shoot.' },\n      ],\n      staySteps: [\n        { n: '01', t: 'We show you the gap', d: 'Where you are missing, misdescribed, or beaten by a knockoff.' },\n        { n: '02', t: 'You choose the move', d: 'Do the recommendation, have us show you, or have us do it. Anything public still needs your OK.' },\n        { n: '03', t: 'We keep you on the new curve', d: 'Answers change. A one-time project is stale in weeks. The Module keeps working the problem.' },\n      ],\n      www: [\n        { k: 'What.', v: 'Exactly what to do.' },\n        { k: 'When.', v: 'When to do it.' },\n        { k: 'Who.', v: 'Who is accountable.' },\n      ],\n      compare: [\n        { c: 'Amazon / shelf', t: 'Usually ignored', o: 'Built in' },\n        { c: 'What you get', t: 'Another traffic report', o: 'What to do next, and why it is true' },\n        { c: 'What goes public', t: 'Often automatic', o: 'Nothing without your OK' },\n        { c: 'What they promise', t: 'Rankings', o: 'No ranking promise. Process and proof.' },\n        { c: 'No averages', t: 'Category mean', o: 'Your brand, not a category mean' },\n        { c: 'New models', t: 'You wait for a release', o: 'Automatic. When the model changes, the read updates.' },\n        { c: 'Setup', t: 'A science project', o: 'Ready out of the box' },\n      ],\n      ...this.tierVals(),\n      ...this.deskVals(),\n      ...this.faqVals(),\n      contactSent: this.state.contactSent, contactOpen: !this.state.contactSent,\n      sendContact: (e) => { e.preventDefault(); this.setState({ contactSent: true }); },\n      privacy: this.PRIVACY.map((s, i) => {\n        const id = 'privacy-' + (i + 1);\n        return { ...s, n: String(i + 1), id, jump: (e) => {\n          e.preventDefault();\n          const el = document.getElementById(id);\n          if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 96, behavior: 'smooth' });\n        } };\n      }),\n      deskFlow: [\n        { n: '01', t: 'Review', delay: '0s' },\n        { n: '02', t: 'Match', delay: ms(930) },\n        { n: '03', t: 'Scope + quote', delay: ms(1860) },\n      ],\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
